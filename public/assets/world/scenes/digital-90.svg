<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <radialGradient id="bg" cx="50%" cy="38%"><stop stop-color="#29433a"/><stop offset=".5" stop-color="#17271f"/><stop offset="1" stop-color="#07100d"/></radialGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#25362d"/><stop offset="1" stop-color="#111a16"/></linearGradient>

 <filter id="glow"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter>
 <pattern id="grid" width="70" height="55" patternUnits="userSpaceOnUse"><path d="M0 54h70M69 0v55" stroke="#77c99a" stroke-opacity=".07"/></pattern>
</defs>


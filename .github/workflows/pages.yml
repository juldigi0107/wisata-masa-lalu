name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  API_CANDIDATE: https://wisata-masa-lalu.juldigi.workers.dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Editorial intelligence report
        run: npm run audit:editorial
      - name: Select exact-compatible Cloudflare API or local fallback
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import localCatalog from './shared/assembled-catalog.js';
          const base = process.env.API_CANDIDATE;
          const origin = 'https://juldigi0107.github.io';
          try {
            const healthResponse = await fetch(base + '/api/health', {
              headers: { Origin: origin, 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(20000)
            });
            if (!healthResponse.ok) throw Error('health HTTP ' + healthResponse.status);
            if (healthResponse.headers.get('access-control-allow-origin') !== origin) throw Error('health CORS mismatch');
            const health = await healthResponse.json();

            const catalogResponse = await fetch(base + '/api/catalog', {
              headers: { Origin: origin, 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(20000)
            });
            if (!catalogResponse.ok) throw Error('catalog HTTP ' + catalogResponse.status);
            if (catalogResponse.headers.get('access-control-allow-origin') !== origin) throw Error('catalog CORS mismatch');
            const catalog = await catalogResponse.json();

            const localIds = new Set(localCatalog.entries.map(entry => entry.id));
            const remoteIds = new Set(Array.isArray(catalog.entries) ? catalog.entries.map(entry => entry.id) : []);
            const exactIds = localIds.size === remoteIds.size && [...localIds].every(id => remoteIds.has(id));
            const noDuplicateRemoteIds = Array.isArray(catalog.entries) && remoteIds.size === catalog.entries.length;
            const compatible = health.ok === true &&
              health.version === localCatalog.version &&
              health.mode === 'curated-static-v2' &&
              health.entries === localCatalog.entries.length &&
              Array.isArray(catalog.entries) &&
              catalog.version === localCatalog.version &&
              catalog.entries.length === localCatalog.entries.length &&
              noDuplicateRemoteIds &&
              exactIds;

            console.log(`Local catalog: v${localCatalog.version}, ${localCatalog.entries.length} entries.`);
            console.log(`Live Worker: v${health.version ?? 'unknown'}, mode=${health.mode ?? 'unknown'}, catalog=${catalog.version ?? 'unknown'}, entries=${catalog.entries?.length ?? 0}.`);

            if (!compatible) {
              console.log('Worker is reachable but not an exact SSOT match (version/mode/count/IDs/CORS); building with bundled catalog to prevent a runtime downgrade.');
              process.exit(0);
            }

            appendFileSync(process.env.GITHUB_ENV, `VITE_API_BASE_URL=${base}\n`);
            console.log('Exact Worker/SSOT match accepted; runtime Cloudflare binding enabled.');
          } catch (error) {
            console.log(`Cloudflare API unavailable/incompatible (${error.message}); building with bundled catalog.`);
          }
          NODE
      - name: Restore licensed visual cache
        uses: actions/cache@v4
        with:
          path: public/assets/media
          key: visual-assets-v2-${{ runner.os }}-${{ hashFiles('scripts/fetch-assets.mjs') }}
          restore-keys: |
            visual-assets-v2-${{ runner.os }}-
      - name: Fetch licensed editorial assets into public/assets/media
        run: node scripts/fetch-assets.mjs
      - name: Build production bundle
        run: npm run build
      - name: Enforce production performance budget
        run: node scripts/check-build-budget.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

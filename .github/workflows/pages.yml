name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  API_CANDIDATE: https://wisata-masa-lalu.juldigi.workers.dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Select compatible Cloudflare API or local fallback
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const base = process.env.API_CANDIDATE;
          const origin = 'https://juldigi0107.github.io';
          try {
            const healthResponse = await fetch(base + '/api/health', {
              headers: { Origin: origin },
              signal: AbortSignal.timeout(20000)
            });
            if (!healthResponse.ok) throw Error('health HTTP ' + healthResponse.status);
            if (healthResponse.headers.get('access-control-allow-origin') !== origin) throw Error('health CORS mismatch');
            const health = await healthResponse.json();

            const catalogResponse = await fetch(base + '/api/catalog', {
              headers: { Origin: origin },
              signal: AbortSignal.timeout(20000)
            });
            if (!catalogResponse.ok) throw Error('catalog HTTP ' + catalogResponse.status);
            if (catalogResponse.headers.get('access-control-allow-origin') !== origin) throw Error('catalog CORS mismatch');
            const catalog = await catalogResponse.json();

            const compatible = health.ok === true &&
              String(health.version || '').startsWith('2.') &&
              health.mode === 'curated-static-v2' &&
              Array.isArray(catalog.entries) && catalog.entries.length >= 10 &&
              String(catalog.version || '').startsWith('2.');

            if (!compatible) {
              console.log(`Cloudflare API reachable but stale/incompatible: health=${health.version ?? 'unknown'} mode=${health.mode ?? 'unknown'} catalog=${catalog.version ?? 'unknown'} entries=${catalog.entries?.length ?? 0}`);
              console.log('Building with bundled curated v2 catalog instead.');
              process.exit(0);
            }

            appendFileSync(process.env.GITHUB_ENV, `VITE_API_BASE_URL=${base}\n`);
            console.log(`Cloudflare API accepted: v${catalog.version}, ${catalog.entries.length} entries.`);
          } catch (error) {
            console.log(`Cloudflare API unavailable/incompatible (${error.message}); building with bundled curated v2 catalog.`);
          }
          NODE
      - name: Fetch licensed editorial assets into public/assets/media
        run: node scripts/fetch-assets.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Cloudflare Workers API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/worker.yml'
permissions:
  contents: read
concurrency:
  group: worker-production
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate API contract
        run: npm test
      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run deploy:worker
      - name: Cloudflare deployment credentials not available to GitHub Actions
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::Worker source and API tests are valid, but GitHub Actions cannot deploy because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured as repository Actions secrets. If Cloudflare Builds is connected directly to this repository, that separate integration can still deploy on push."

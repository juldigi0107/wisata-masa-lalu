name: Deploy Cloudflare Workers API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/verify-worker.mjs'
      - 'scripts/editorial-report.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/worker.yml'
permissions:
  contents: read
concurrency:
  group: worker-production
  cancel-in-progress: true
env:
  WORKER_BASE_URL: https://wisata-masa-lalu.juldigi.workers.dev
  ALLOWED_ORIGIN: https://juldigi0107.github.io
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate API and editorial contracts
        run: npm test
      - name: Editorial intelligence report
        run: npm run audit:editorial
      - name: Deploy Worker
        id: deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run deploy:worker
      - name: Verify live Worker matches assembled SSOT and audit contract
        if: ${{ steps.deploy.outcome == 'success' }}
        env:
          VERIFY_ATTEMPTS: '8'
          VERIFY_DELAY_MS: '5000'
        run: node scripts/verify-worker.mjs
      - name: Probe live Worker when GitHub deploy credentials are unavailable
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        continue-on-error: true
        env:
          VERIFY_ATTEMPTS: '1'
          VERIFY_DELAY_MS: '0'
        run: node scripts/verify-worker.mjs
      - name: Cloudflare deployment credentials not available to GitHub Actions
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::Source/tests are valid, but GitHub Actions cannot deploy this Worker because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured as repository Actions secrets. The preceding probe records whether another Cloudflare Git integration already synchronized the live Worker. Do not paste these secrets into source code or chat."
